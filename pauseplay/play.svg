<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Flag Pole Gradient -->
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7f8c8d" />
      <stop offset="50%" stop-color="#bdc3c7" />
      <stop offset="100%" stop-color="#95a5a6" />
    </linearGradient>

    <!-- 3D Fabric Wave Gradient -->
    <linearGradient id="blueWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d6491" />
      <stop offset="25%" stop-color="#3498db" />
      <stop offset="50%" stop-color="#217dbb" />
      <stop offset="75%" stop-color="#4aa3df" />
      <stop offset="100%" stop-color="#1a5c85" />
    </linearGradient>
  </defs>

  <!-- Flag Pole -->
  <rect x="96" y="64" width="24" height="384" rx="4" fill="url(#poleGrad)" />
  
  <!-- Flag Cloth with Wave Gradient -->
  <path d="M 120 96 H 416 V 288 H 120 Z" fill="url(#blueWave)" />
</svg>
